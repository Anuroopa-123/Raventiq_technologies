server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/dinaroop;          # copy dist/frontend/browser here
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 6M;   # a bit above MAX_UPLOAD_MB so poster uploads aren't cut off
    }

    # uploaded poster images (backend/uploads/, served by FastAPI's StaticFiles)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;   # Angular routing
    }
}
